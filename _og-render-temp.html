<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, rgba(120,90,200,0.35), rgba(7,6,26,0) 55%),
                linear-gradient(160deg, #241c3d 0%, #07061a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 630px;
    position: relative;
  }
  .stars {
    position: absolute;
    inset: 0;
  }
  .dot {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .brand img {
    width: 64px;
    height: 64px;
  }
  .brand span {
    font-weight: 900;
    letter-spacing: 1px;
    font-size: 34px;
    background: linear-gradient(180deg, #ffffff 0%, #b7b7b7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: "Arial Black", "Franklin Gothic Bold", Impact, sans-serif;
  }
  h1 {
    color: #ffffff;
    font-size: 52px;
    font-weight: 700;
    text-align: center;
    max-width: 940px;
    line-height: 1.25;
    margin-bottom: 24px;
  }
  p {
    color: #b7b7b7;
    font-size: 26px;
    text-align: center;
  }
  .url {
    margin-top: 40px;
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="brand">
    <img src="logo-mark.png" alt="" />
    <span>OUT OF POCKET TV</span>
  </div>
  <h1>What are the chances the person<br>of my dreams exists?</h1>
  <p>A real-odds calculator built on U.S. Census &amp; global population data</p>
  <div class="url">outofpocket.tv</div>
  <script>
    const stars = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.left = Math.random() * 100 + '%';
      d.style.top = Math.random() * 100 + '%';
      d.style.opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
      stars.appendChild(d);
    }
  </script>
</body>
</html>
