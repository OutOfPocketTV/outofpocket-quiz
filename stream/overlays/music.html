<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Starting Soon Music</title>
<style>
  /* Audio-only source. It draws nothing unless ?badge=1, so it can sit
     anywhere in the scene at any size without covering artwork. */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #badge{
    display:none;
    position:fixed;top:8px;left:8px;
    max-width:520px;
    padding:8px 12px;
    border-radius:10px;
    background:rgba(4,8,6,.72);
    border:1px solid rgba(77,255,122,.35);
    color:#d7ffe4;
    font:500 13px/1.45 "IBM Plex Mono", ui-monospace, Consolas, monospace;
    white-space:pre;
  }
  body.badge #badge{display:block}
  #badge b{color:#4dff7a;font-weight:600}
  #badge .warn{color:#fff36b}
  #badge .err{color:#ff6b6b}
</style>
</head>
<body>
<div id="badge">starting…</div>

<script src="relay-client.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- options
  const q = new URLSearchParams(location.search);
  // Number(null) is 0, not NaN, so testing the parse alone would silently
  // turn every option this page has into zero the moment it wasn't given
  // one -- a muted player with no crossfade. Check for the parameter first.
  const num = (key, dflt, lo, hi) => {
    const raw = q.get(key);
    if (raw === null || raw.trim() === "") return dflt;
    const v = Number(raw);
    return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : dflt;
  };

  const VOL      = num("vol", 0.75, 0, 1);
  // iTunes' crossfade slider tops out at 12s and sits around 6 by default.
  const XFADE    = num("xfade", 8, 0, 20);
  // Must match the countdown overlay's `urgent` window (left <= 10000) or the
  // clock turns yellow at a different moment than the music starts leaving.
  const DUCK_S   = num("fade", 10, 1, 60);
  const TICKS_ON = q.get("ticks") !== "0";
  const TICK_VOL = num("tickvol", 0.85, 0, 1);
  // ?riser= is gone: the tension bed was an oscillator, and there is no
  // Web Audio here any more. Removed rather than left to throw if enabled.
  // Level of the first tick, rising to full by the last. The build is the
  // suspense; ?tickmin=1 plays all ten flat.
  const TICK_MIN = num("tickmin", 0.4, 0, 1);
  if (q.get("badge") === "1") document.body.classList.add("badge");

  const badge = document.getElementById("badge");
  let badgeState = { track: "—", next: "—", note: "" };
  function paintBadge() {
    badge.innerHTML =
      "<b>now</b>  " + badgeState.track +
      "\n<b>next</b> " + badgeState.next +
      (badgeState.note ? "\n" + badgeState.note : "");
  }

  // ------------------------------------------------------------ audio graph
  //
  //   deck A ─┐
  //           ├─► master ─┐
  //   deck B ─┘           ├─► limiter ─► out
  //          ticks ───────┘
  //
  // The ticks deliberately bypass `master`. The countdown fade runs on master,
  // and the whole point of the last ten seconds is that the pips keep cutting
  // through while the music leaves underneath them.
  // --- why there is no Web Audio in this file --------------------------
  //
  // OBS's browser source on this rig does not capture AudioContext output.
  // Proven by recording the source with the mic and desktop muted: a page
  // playing a plain <audio> element records at a real level, while the same
  // audio routed through an AudioContext records -91 dB, which is digital
  // silence. The page looks perfectly healthy either way -- context running,
  // clip decoded, ten ticks scheduled -- and none of it reaches the mixer.
  //
  // So everything below drives media-element .volume instead. To avoid
  // rewriting every crossfade and duck call site, the automation this file
  // already speaks (setValueAtTime / linearRampToValueAtTime /
  // setValueCurveAtTime / cancelScheduledValues) is re-implemented against a
  // clock and applied to .volume on a timer. Same calls, same curves, an
  // output that can actually be heard.
  //
  // What is genuinely lost is the limiter -- there is no way to compress
  // without an audio graph. Levels here are conservative and the ticks are
  // the only thing that ever sums with music, so it should not bite; it is
  // called out because "the limiter quietly stopped existing" is exactly the
  // kind of thing that turns into a mystery crackle six months from now.

  const nowSec = () => performance.now() / 1000;

  function makeFader(initial) {
    let events = [];
    const param = {
      value: initial,
      cancelScheduledValues(t) {
        // Pin the current value first, or cancelling mid-ramp snaps the
        // volume back to wherever the last explicit point was.
        const held = param._eval(t);
        events = events.filter((e) => e.t < t);
        events.push({ kind: "set", v: held, t });
      },
      setValueAtTime(v, t) { events.push({ kind: "set", v, t }); return param; },
      linearRampToValueAtTime(v, t) { events.push({ kind: "lin", v, t }); return param; },
      setValueCurveAtTime(curve, t, dur) {
        events.push({ kind: "curve", curve, t, dur });
        return param;
      },
      _eval(now) {
        events.sort((a, b) => a.t - b.t);
        let prevV = initial;
        let prevT = -Infinity;
        for (const e of events) {
          if (e.kind === "curve") {
            if (now >= e.t + e.dur) { prevV = e.curve[e.curve.length - 1]; prevT = e.t + e.dur; continue; }
            if (now >= e.t) {
              const f = (now - e.t) / e.dur;
              const idx = Math.min(e.curve.length - 1, Math.max(0, Math.floor(f * (e.curve.length - 1))));
              return e.curve[idx];
            }
            return prevV;
          }
          if (now >= e.t) { prevV = e.v; prevT = e.t; continue; }
          if (e.kind === "lin") {
            const span = e.t - prevT;
            if (span <= 0) return e.v;
            const f = Math.min(1, Math.max(0, (now - prevT) / span));
            return prevV + (e.v - prevV) * f;
          }
          return prevV;   // a future setValueAtTime holds the previous value
        }
        return prevV;
      },
    };
    return param;
  }

  // Stand-ins so the rest of the file keeps reading naturally. `ctx.state` is
  // reported as running because there is no context to be suspended.
  const ctx = {
    get currentTime() { return nowSec(); },
    get state() { return "running"; },
    resume() { return Promise.resolve(); },
  };

  const master = { gain: makeFader(VOL) };
  const tickBus = { gain: makeFader(TICK_VOL) };

  const clamp01 = (v) => Math.max(0, Math.min(1, Number.isFinite(v) ? v : 0));

  // The one place element volume is actually written. Runs often enough that
  // a 10-second duck and a 0.18s pause taper both read as smooth, and cheap
  // enough to not matter on a browser source rendering at 30fps.
  function applyVolumes() {
    const t = nowSec();
    const m = clamp01(master.gain._eval(t));
    master.gain.value = m;
    for (const d of decks) {
      const g = clamp01(d.gain.gain._eval(t));
      d.gain.gain.value = g;
      try { d.el.volume = clamp01(m * g); } catch (e) {}
    }
  }

  // Equal-power curves. Two linear ramps crossing would dip about 3dB in the
  // middle -- audible as a dead spot every time a track changes. cos/sin keep
  // the summed power flat across the blend, which is what a proper crossfader
  // does and what makes the transition read as "one continuous thing".
  const CURVE_N = 128;
  const CURVE_OUT = new Float32Array(CURVE_N);
  const CURVE_IN  = new Float32Array(CURVE_N);
  for (let i = 0; i < CURVE_N; i++) {
    const t = i / (CURVE_N - 1);
    CURVE_OUT[i] = Math.cos(t * Math.PI / 2);
    CURVE_IN[i]  = Math.sin(t * Math.PI / 2);
  }

  // ----------------------------------------------------------------- decks
  //
  // MediaElement rather than decoded buffers on purpose: a decoded four
  // minute track is ~80MB of PCM, and holding two of them to overlap would
  // be most of a browser source's memory for no gain. The element streams
  // from the relay and the crossfade only needs gain automation.
  //
  // Deliberately NOT connected to any audio graph -- see the note at the top.
  // The element plays to the browser's own output, which is what OBS captures,
  // and its level is driven by applyVolumes() from the fader below.
  function makeDeck(name) {
    const el = new Audio();
    el.preload = "auto";
    el.volume = 0;
    return { name, el, gain: { gain: makeFader(0) }, track: null, fading: false, blendUntil: 0 };
  }
  const decks = [makeDeck("A"), makeDeck("B")];

  // Started HERE, not next to applyVolumes() itself. `decks` is a const
  // declared below the engine, so a timer touching it any earlier throws a
  // temporal-dead-zone error on every tick -- silently, inside a callback --
  // and element volumes are simply never written. The page looks fine and
  // plays nothing, which is exactly the failure this rewrite was meant to
  // fix, reintroduced one level down.
  setInterval(applyVolumes, 25);
  let live = 0; // index of the deck currently carrying the show

  // -------------------------------------------------------------- playlist
  //
  // A shuffle bag, not a random pick per track: drawing at random replays the
  // same song twice in a row often enough to notice across a ten minute
  // Starting Soon. The bag plays every track once, then reshuffles, and only
  // avoids repeating across the seam.
  let library = [];
  let bag = [];

  function refillBag() {
    const last = bag.length ? null : (decks[live].track || null);
    bag = library.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    // Don't let a reshuffle start with whatever just finished.
    if (last && bag.length > 1 && bag[0].file === last.file) {
      [bag[0], bag[1]] = [bag[1], bag[0]];
    }
  }

  function nextTrack() {
    if (!library.length) return null;
    if (!bag.length) refillBag();
    return bag.shift() || null;
  }

  function urlFor(t) { return "/music/" + encodeURIComponent(t.file); }

  // ------------------------------------------------------------- crossfade
  function fadeDecks(fromDeck, toDeck, seconds) {
    const now = ctx.currentTime;
    const secs = Math.max(0.05, seconds);
    for (const d of [fromDeck, toDeck]) d.gain.gain.cancelScheduledValues(now);
    try {
      fromDeck.gain.gain.setValueCurveAtTime(CURVE_OUT, now, secs);
      toDeck.gain.gain.setValueCurveAtTime(CURVE_IN, now, secs);
    } catch (err) {
      // setValueCurveAtTime throws if it lands on top of live automation.
      // A plain ramp is a worse blend but an infinitely better outcome than
      // the playlist stopping dead.
      fromDeck.gain.gain.linearRampToValueAtTime(0, now + secs);
      toDeck.gain.gain.linearRampToValueAtTime(1, now + secs);
    }
    // Curves leave the value wherever the last sample was; pin the ends so
    // later automation starts from a known place.
    fromDeck.gain.gain.setValueAtTime(0, now + secs);
    toDeck.gain.gain.setValueAtTime(1, now + secs);
  }

  function startNext(blendSeconds) {
    if (surrendered) return;
    const track = nextTrack();
    if (!track) return;
    const from = decks[live];
    const to = decks[1 - live];

    to.el.src = urlFor(track);
    to.track = track;
    to.el.currentTime = 0;
    const played = to.el.play();
    if (played && played.catch) played.catch(() => { /* handled by the resume poke */ });

    if (blendSeconds > 0 && from.track) {
      fadeDecks(from, to, blendSeconds);
      // Both decks are legitimately audible until this passes. The sweeper
      // below leaves them alone while it holds.
      from.blendUntil = performance.now() + blendSeconds * 1000 + 250;
      // Only stop the outgoing deck once it is actually silent, or the tail
      // of the old track gets chopped mid-blend.
      setTimeout(() => {
        if (decks[live] !== from) { try { from.el.pause(); } catch (e) {} }
      }, blendSeconds * 1000 + 250);
    } else {
      const now = ctx.currentTime;
      to.gain.gain.cancelScheduledValues(now);
      to.gain.gain.setValueAtTime(0, now);
      to.gain.gain.linearRampToValueAtTime(1, now + 0.6);
      // No blend means no reason for the old deck to still be running, and
      // this branch used to leave it playing at whatever gain it had -- two
      // tracks at once, for the rest of the night.
      from.blendUntil = 0;
      if (from !== to) {
        try { from.el.pause(); } catch (e) {}
        from.gain.gain.cancelScheduledValues(now);
        from.gain.gain.setValueAtTime(0, now);
      }
    }

    live = 1 - live;
    from.fading = false;
    badgeState.track = track.name;
    badgeState.next = bag.length ? bag[0].name : "(reshuffle)";
    paintBadge();

    // Tell the relay what is playing so the control panel can name it. The
    // relay knows nothing about the playlist otherwise -- it only serves the
    // folder -- and a transport with no track name on it is a guess.
    fetch("/music", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "now", track: track.name }),
    }).catch(() => { /* naming is cosmetic; never let it break playback */ });
  }

  // The blend has to start early enough that it *ends* at the track's end,
  // otherwise the outgoing song is still audible when it runs out of audio
  // and you get a gap instead of a transition.
  function blendFor(el) {
    const d = Number(el.duration);
    if (!Number.isFinite(d) || d <= 0) return 0;
    // Never spend more than a third of a track blending -- on a short cut
    // that would mean it is fading for most of its own runtime.
    return Math.min(XFADE, d / 3);
  }

  let dormant = false;    // stopped by a countdown reaching zero
  let started = false;
  let userPaused = false; // stopped from the control panel

  // This page's identity for the whole time it is loaded. A browser source
  // that reloads while the previous CEF instance is still tearing down leaves
  // two players alive, each correctly playing one track and each convinced it
  // is alone -- which is two songs at once and invisible from inside either.
  // The relay hands ownership to whoever said hello last; everyone else goes
  // quiet and stays quiet.
  const INSTANCE_ID = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  let surrendered = false;

  function surrender() {
    if (surrendered) return;
    surrendered = true;
    for (const d of decks) {
      try { d.el.pause(); } catch (e) {}
      try { d.el.src = ""; } catch (e) {}
    }
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(0, now);
    tickBus.gain.cancelScheduledValues(now);
    tickBus.gain.setValueAtTime(0, now);
    badgeState.note = "<span class='warn'>a newer source took over — this one is muted</span>";
    paintBadge();
  }

  // Whether this page has actually staked its claim yet. Until it has, the
  // relay is still naming the PREVIOUS page as owner, and acting on that is
  // how a freshly opened source mutes itself for good.
  let claimed = false;

  function claim() {
    return fetch("/music", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "hello", id: INSTANCE_ID }),
    }).then(() => { claimed = true; })
      .catch(() => { /* the relay will be back; connectRelay retries */ });
  }

  // Every place that returns the music to normal level has to agree about
  // what normal is, or resuming from a countdown would undo a pause.
  function targetVol() { return userPaused ? 0 : VOL; }

  // A real pause, not a mute: the deck keeps its position so resuming picks
  // the track up where it stopped. The 180ms taper either side is there
  // because cutting a waveform mid-cycle is an audible click on a stream.
  function setPaused(on) {
    if (on === userPaused) return;
    userPaused = on;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    if (on) {
      master.gain.linearRampToValueAtTime(0, now + 0.18);
      setTimeout(() => {
        if (!userPaused) return;
        for (const d of decks) { try { d.el.pause(); } catch (e) {} }
      }, 200);
      badgeState.note = "<span class='warn'>paused from the panel</span>";
    } else {
      if (!dormant && started) {
        const d = decks[live];
        if (d.track) { const p = d.el.play(); if (p && p.catch) p.catch(() => {}); }
      }
      master.gain.linearRampToValueAtTime(VOL, now + 0.3);
      badgeState.note = "";
    }
    paintBadge();
  }

  // Only one deck may be audible outside a crossfade. This is a safety net,
  // not the mechanism -- startNext stops the outgoing deck itself -- but a
  // skip landing inside a blend, a pause landing inside one, or a source
  // reloading mid-fade have all been able to leave two running. Two tracks at
  // once on a live stream is the worst possible way to discover that, so it
  // is worth a check every tick rather than trusting every path to be right.
  function enforceSingleDeck() {
    const other = decks[1 - live];
    if (other.el.paused) return;
    if (other.blendUntil && performance.now() < other.blendUntil) return;
    try { other.el.pause(); } catch (e) {}
    const now = ctx.currentTime;
    other.gain.gain.cancelScheduledValues(now);
    other.gain.gain.setValueAtTime(0, now);
    other.blendUntil = 0;
  }

  function pump() {
    if (dormant || userPaused || !started || surrendered) return;
    const cur = decks[live];
    if (!cur.track || cur.el.paused) return;
    const d = Number(cur.el.duration);
    if (!Number.isFinite(d) || d <= 0) return;   // metadata not in yet
    const blend = blendFor(cur.el);
    if (!cur.fading && d - cur.el.currentTime <= blend + 0.05) {
      cur.fading = true;
      startNext(blend);
    }
  }

  // Belt and braces for a track whose duration never resolves, or one that
  // errors mid-play: without this the playlist would simply stop.
  for (const d of decks) {
    d.el.addEventListener("ended", () => {
      if (decks[live] === d && !dormant && started) startNext(0);
    });
    d.el.addEventListener("error", () => {
      if (decks[live] === d && !dormant && started) {
        badgeState.note = "<span class='warn'>skipped a track that would not load</span>";
        paintBadge();
        startNext(0);
      }
    });
  }

  // ------------------------------------------------------------ the countdown
  //
  // The relay pushes `countdown` only when something changes, so the arrival
  // of the last ten seconds has to be noticed here rather than waited for.
  let cd = null;
  let armedFor = null;   // the endsAt we have already scheduled against

  function msLeft(c) {
    if (!c) return Infinity;
    if (!c.running) return Math.max(0, c.remaining || 0);
    return Math.max(0, (c.endsAt || 0) - Date.now());
  }

  // Ten ticks: 10 down to 1, then nothing at zero. The last thing the
  // audience hears before the intro video is one clean second of silence,
  // which is what makes the video's own first frame land.
  //
  // `tension` runs 0 at ten seconds out to 1 at one second out. Every voice
  // below leans on it, so the sequence tightens on its own rather than
  // switching between a "normal" and an "urgent" sound.

  // One sound. Not a default, not a choice, and not seedable from the
  // URL -- the synth voices that used to live here were deleted rather
  // than hidden, so there is nothing for this to fall back to and
  // nothing that can quietly replace it. Everything below this line,
  // including how the clip is fetched and scheduled, is exactly the
  // code that was already playing it.
  const TICK_STYLE = "file:Countdown Sound Effect.mp3";

  // --- the countdown tick ----------------------------------------------
  //
  // One recording, played by plain <audio> elements. There is no decoding and
  // no scheduling against an audio clock any more -- both needed Web Audio,
  // which is silent here. A small pool played on timers is less
  // sample-accurate, but at one-second spacing the difference is far below
  // what anyone can hear, and it is the difference between audible and not.
  //
  // The clip opens with about 101ms of silence (measured from the file).
  // Starting playback past it keeps every hit on the beat instead of
  // dragging, which is what the old onset detection was for.
  const TICK_URL = "/sfx/" + encodeURIComponent("Countdown Sound Effect.mp3");
  const TICK_LEAD_SKIP = 0.101;
  let tickBufFailed = false;

  // Four is enough: the clip runs ~1.1s against 1s spacing, so at most two
  // overlap, and a spare either side covers a late timer.
  const tickPool = [];
  for (let i = 0; i < 4; i++) {
    const a = new Audio(TICK_URL);
    a.preload = "auto";
    a.volume = 0;
    a.addEventListener("error", () => {
      tickBufFailed = true;
      badgeState.note = "<span class='err'>countdown sound would not load — the ticks will be silent</span>";
      paintBadge();
    });
    tickPool.push(a);
  }
  let tickAt = 0;
  let tickReady = false;
  tickPool[0].addEventListener("canplaythrough", () => { tickReady = true; reportTick(); }, { once: true });

  // Kept for the callers that still ask; there is nothing to decode now, so
  // this only reports readiness.
  function loadTickFile() {
    for (const a of tickPool) { try { a.load(); } catch (e) {} }
    return Promise.resolve(tickReady);
  }

  function playTickFile(level) {
    if (tickBufFailed) return false;
    const a = tickPool[tickAt];
    tickAt = (tickAt + 1) % tickPool.length;
    try {
      a.pause();
      a.currentTime = TICK_LEAD_SKIP;
      a.volume = clamp01(level * tickBus.gain._eval(nowSec()));
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      return true;
    } catch (e) {
      return false;
    }
  }

  // `when` is still an absolute time in the same units ctx.currentTime uses,
  // so arm() did not have to change. It becomes a timer delay here.
  let tickTimers = [];
  function pip(when, secondsOut) {
    const tension = Math.min(1, Math.max(0, (10 - secondsOut) / 9));
    const level = TICK_MIN + (1 - TICK_MIN) * tension;
    const delayMs = Math.max(0, (when - nowSec()) * 1000);
    tickTimers.push(setTimeout(() => playTickFile(level), delayMs));
    return true;
  }

  function clearTickTimers() {
    for (const t of tickTimers) clearTimeout(t);
    tickTimers = [];
  }

  let scheduled = [];   // gain nodes we may need to silence on a disarm

  function disarm(restore) {
    armedFor = null;
    clearTickTimers();
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    if (restore) {
      // He pulled the trigger back -- pause, +time, or a stop. Come back up
      // rather than sitting ducked with no clock on screen.
      const from = master.gain.value;
      master.gain.setValueAtTime(from, now);
      master.gain.linearRampToValueAtTime(targetVol(), now + 1.5);
    }
    scheduled = [];
  }

  function arm(endsAt) {
    armedFor = endsAt;
    const left = Math.max(0, endsAt - Date.now());
    // One shared mapping from wall clock to audio clock, taken once, so the
    // pips and the fade cannot drift apart from each other.
    const t0 = ctx.currentTime;
    const zero = t0 + left / 1000;

    // --- the fade
    const from = master.gain.value;
    const curve = new Float32Array(CURVE_N);
    for (let i = 0; i < CURVE_N; i++) {
      curve[i] = from * Math.cos((i / (CURVE_N - 1)) * Math.PI / 2);
    }
    master.gain.cancelScheduledValues(t0);
    const dur = Math.max(0.05, zero - t0);
    try {
      master.gain.setValueCurveAtTime(curve, t0, dur);
    } catch (err) {
      master.gain.setValueAtTime(from, t0);
      master.gain.linearRampToValueAtTime(0, zero);
    }
    // cos(pi/2) is 0 to floating point, not exactly 0. Pin it, so the intro
    // video starts against real silence rather than against -60dB of music.
    master.gain.setValueAtTime(0, zero);

    // --- the ticks
    if (TICKS_ON) {
      for (let s = 10; s >= 1; s--) {
        const when = zero - s;
        if (when <= t0 + 0.02) continue;   // that second has already gone
        pip(when, s);
      }
    }

    // --- go dormant at zero, so nothing is decoding under the intro video
    const holdFor = Math.max(0, endsAt - Date.now()) + 120;
    setTimeout(() => {
      if (armedFor !== endsAt) return;     // superseded by a newer countdown
      dormant = true;
      for (const d of decks) { try { d.el.pause(); } catch (e) {} }
      badgeState.note = "<span class='warn'>ducked to silence at zero</span>";
      paintBadge();
    }, holdFor);
  }

  function wake() {
    dormant = false;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(targetVol(), now + 2);
    badgeState.note = "";
    // Both decks were paused at zero; start a fresh track rather than
    // resuming one from the middle of wherever it was cut off.
    for (const d of decks) { d.track = null; d.fading = false; d.gain.gain.value = 0; }
    startNext(0);
  }

  function onCountdown(next) {
    const before = cd;
    cd = next || null;

    if (!cd || !cd.running) {
      // A countdown that RAN OUT and one that was pulled back need opposite
      // answers, and this could not tell them apart.
      //
      // The relay clears the countdown the instant it hits zero, but
      // `dormant` is only set 120ms later by the hold timer below. In that
      // gap this saw armedFor set and dormant false -- the signature of a
      // stop, a pause or a +time -- and ran the restore, ramping master from
      // silence back to full over 1.5s exactly as the scene cut to the intro
      // video. Heard as the music surging back for a split second over the
      // top of the transition, which is the one thing the fade exists to
      // prevent.
      //
      // armedFor IS the end timestamp, so "did it reach zero" is just a
      // clock comparison. 150ms of slack covers the push arriving a moment
      // before the local clock agrees.
      const ranOut = armedFor !== null && Date.now() >= armedFor - 150;
      if (ranOut) {
        // Stay down, and go dormant here rather than waiting for the hold
        // timer -- clearing armedFor is about to make that timer bail, and
        // without this the decks would keep decoding under the intro video.
        armedFor = null;
        clearTickTimers();
        const now = ctx.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(0, now);
        dormant = true;
        for (const d of decks) { try { d.el.pause(); } catch (e) {} }
        badgeState.note = "<span class='warn'>ducked to silence at zero</span>";
        paintBadge();
        return;
      }
      if (armedFor !== null && !dormant) disarm(true);
      else armedFor = null;
      return;
    }

    // A different clock than the one we armed against (start, resume, +time).
    if (armedFor !== null && armedFor !== cd.endsAt) disarm(!dormant);

    if (dormant && msLeft(cd) > DUCK_S * 1000) wake();
    void before;
  }

  // 100ms is plenty: it drives the crossfade hand-off and the moment the
  // clock crosses into its last ten seconds, and both have a second of slack.
  setInterval(() => {
    // Before pump, and not gated on paused or dormant: a stray deck is most
    // likely precisely when the normal path has been interrupted.
    enforceSingleDeck();
    pump();
    if (cd && cd.running && armedFor === null) {
      const left = msLeft(cd);
      if (left <= DUCK_S * 1000 && left > 0) arm(cd.endsAt);
    }
  }, 100);

  // ------------------------------------------------------------------- boot
  //
  // OBS launches CEF with autoplay allowed, so this normally just runs. In a
  // normal browser it will not, hence the poke on first interaction -- which
  // is only ever used while setting the thing up.
  function resume() {
    if (ctx.state !== "running") ctx.resume().catch(() => {});
  }
  resume();
  addEventListener("pointerdown", resume);
  addEventListener("keydown", resume);
  setInterval(resume, 2000);

  fetch("/music")
    .then((r) => r.json())
    .then((data) => {
      library = (data && data.tracks) || [];
      if (!library.length) {
        badgeState.note = "<span class='err'>no tracks in " + (data && data.dir) + "</span>";
        badgeState.track = "—";
        paintBadge();
        return;
      }
      refillBag();
      started = true;
      startNext(0);
    })
    .catch(() => {
      badgeState.note = "<span class='err'>could not read the playlist</span>";
      paintBadge();
    });

  // Skips arrive as a counter rather than a flag so two presses read as two
  // skips. The first message only records where the counter is -- treating it
  // as a change would skip a track every time the source reconnected.
  let lastSkips = null;
  let lastDemos = null;

  // Tell the relay what this source is *actually* using, as opposed to what
  // the panel last asked for. The two can differ -- a browser source that has
  // not reloaded is still running whatever code and choice it started with --
  // and that difference is otherwise only detectable by ear, which is a
  // terrible way to find out.
  let lastReported = null;
  function reportTick() {
    const sig = String(tickReady);
    // The relay pushes `music` back out to every overlay, including this one,
    // so reporting unconditionally would report on its own echo forever.
    if (sig === lastReported) return;
    lastReported = sig;
    fetch("/music", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "using",
        tick: TICK_STYLE,
        ready: tickReady,
      }),
    }).catch(() => { /* reporting is diagnostic; never let it break playback */ });
  }

  // Play the ten-tick sequence on its own, so it can be auditioned through
  // the real OBS source at the real level instead of guessed at. Ticks only:
  // the music keeps playing, which is roughly what the top of the fade
  // sounds like anyway.
  function previewTicks() {
    const go = () => {
      const t0 = ctx.currentTime + 0.15;
      for (let s = 10; s >= 1; s--) pip(t0 + (10 - s), s);
      badgeState.note = "<span class='warn'>countdown tick preview</span>";
      paintBadge();
      setTimeout(() => { badgeState.note = ""; paintBadge(); }, 11000);
    };
    // Re-read the clip first, so an edit on disk is what gets auditioned
    // rather than whatever was decoded the first time round.
    loadTickFile(TICK_STYLE, true).then(go);
  }

  function onMusic(m) {
    if (!m) return;
    // Ownership first: everything below is about playing, and a page that has
    // been superseded must not act on any of it.
    //
    // But only once WE have claimed. connectRelay starts delivering `music`
    // pushes as soon as the stream opens, and those can land before claim()
    // has completed -- carrying the previous page's id. Acting on that made a
    // freshly opened source surrender to its own predecessor: master volume
    // to 0, deck src wiped, and `surrendered` never cleared, so it stayed
    // silent for the life of the page while reporting a healthy track.
    // That is the bug that made the music and the countdown ticks both
    // inaudible with nothing on screen to show for it.
    if (claimed && m.owner && m.owner !== INSTANCE_ID) { surrender(); return; }
    if (surrendered) return;
    setPaused(Boolean(m.paused));
    // There is no choice to receive any more, so this only makes sure the
    // clip is decoded before a countdown needs it. loadTickFile() returns
    // the cached buffer once it has one, so every push after the first is a
    // no-op. Called from here because this is where it was always called
    // from and the first decode therefore still happens exactly as early.
    loadTickFile(TICK_STYLE).then(reportTick);
    if (typeof m.demos === "number") {
      if (lastDemos !== null && m.demos > lastDemos) previewTicks();
      lastDemos = m.demos;
    }
    if (typeof m.skips === "number") {
      if (lastSkips !== null && m.skips > lastSkips && started && !dormant) {
        startNext(Math.min(1.5, XFADE));
        // Skipping while paused picks the next track without breaking the
        // pause -- the button should never feel dead, but it must not start
        // the music either.
        if (userPaused) {
          setTimeout(() => {
            if (!userPaused) return;
            for (const d of decks) { try { d.el.pause(); } catch (e) {} }
          }, 60);
        }
      }
      lastSkips = m.skips;
    }
  }

  connectRelay({
    events: { countdown: onCountdown, music: onMusic },
    onOpen() {
      if (surrendered) return;
      // Claim on every connect, not just the first: a relay restart or a
      // dropped stream must not leave a live page disowned and silent.
      //
      // The /state read is chained behind it deliberately. Read first and it
      // can still name the previous owner, and this page would obediently
      // mute itself over a claim that had not landed yet.
      claim()
        .then(() => fetch("/state"))
        .then((r) => r.json())
        .then((s) => {
          if (!s) return;
          if (s.countdown !== undefined) onCountdown(s.countdown);
          if (s.music) onMusic(s.music);
        })
        .catch(() => {});
    },
  });

  paintBadge();

  // A read-only handle for checking this from the console or a test harness:
  // the gain that matters is inside the audio graph, so without it there is
  // no way to tell a working duck from a broken one except by ear.
  window.oopMusic = {
    ctx,
    state: () => ({
      audio: ctx.state,
      master: Number(master.gain.value.toFixed(4)),
      tickBus: Number(tickBus.gain.value.toFixed(3)),
      live: decks[live].name,
      track: decks[live].track && decks[live].track.name,
      at: Number((decks[live].el.currentTime || 0).toFixed(1)),
      dur: Number((decks[live].el.duration || 0).toFixed(1)),
      gains: decks.map((d) => Number(d.gain.gain.value.toFixed(3))),
      paused: decks.map((d) => d.el.paused),
      queued: bag.length,
      armed: armedFor,
      dormant,
      tickStyle: TICK_STYLE,
      tickLeadSkipMs: Math.round(TICK_LEAD_SKIP * 1000),
      tickReady,
    }),
  };
})();
</script>
</body>
</html>
