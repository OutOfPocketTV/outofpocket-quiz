<meta charset="utf-8" />
<title>Out Of Pocket — delusion meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
/>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Space Grotesk", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f3f3f3;
    -webkit-font-smoothing: antialiased;
  }

  /* The panel used to sit at 0,0 and run 4px wider and 5px taller than the
     source, so its right and bottom edges -- border, glow and all -- were
     quietly clipped, and it read as sitting off to one side however carefully
     the OBS box was centred. Centring here rather than in OBS means it stays
     centred at any source size, on any canvas. */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    /* border-box so the stated width is the width it actually occupies --
       content-box was adding 52px of padding and 2px of border on top of the
       960, which is where the overflow came from. */
    box-sizing: border-box;
    width: 960px;
    /* Trimmed from 20/18: the panel came to 305px tall in a 300px source, so
       its top and bottom edges were being shaved off. A few px of headroom
       here costs nothing visually and keeps the border and glow intact. */
    padding: 16px 26px 14px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(23, 21, 30, 0.92), rgba(9, 8, 12, 0.94));
    border: 1px solid rgba(157, 140, 255, 0.28);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 46px rgba(157, 140, 255, 0.14);
  }
  body.vertical .panel {
    width: 620px;
  }

  /* ------------------------------------------------------------- flush
     For a column that butts straight up against the camera above it and the
     chat below it: the panel is the whole source, edge to edge, with square
     corners and no drop shadow -- anything that reads as a floating card
     breaks the join. Rendered at half size in OBS (a 1280x480 source in a
     640x240 box), so every size here is double what lands on the canvas,
     which also supersamples the text on the way down. */
  body.flush {
    align-items: stretch;
    justify-content: stretch;
  }
  body.flush .panel {
    width: 100%;
    height: 100%;
    padding: 26px 40px 22px;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    background: linear-gradient(180deg, rgba(23, 21, 30, 0.94), rgba(9, 8, 12, 0.96));
    display: flex;
    flex-direction: column;
  }
  /* Three columns so the title is centred on the panel itself, rather than
     on whatever space the answered-count happens to leave it. */
  body.flush header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 20px;
  }
  body.flush .live-dot { grid-column: 1; justify-self: start; width: 16px; height: 16px; }
  body.flush .title { grid-column: 2; font-size: 52px; letter-spacing: 0.18em; text-indent: 0.18em; }
  body.flush .total { grid-column: 3; justify-self: end; margin-left: 0; }
  body.flush .total b { font-size: 54px; }
  body.flush .total span { font-size: 22px; }
  /* The footer already names the colours next to tinted totals, so the
     header key is a second legend for the same thing. */
  body.flush .key { display: none; }

  body.flush #rows {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  body.flush .row {
    grid-template-columns: 300px 88px 1fr 108px;
    gap: 22px;
    padding: 9px 0;
  }
  body.flush .row .name { font-size: 36px; letter-spacing: 0.14em; }
  body.flush .row .n { font-size: 52px; }
  body.flush .bar { height: 24px; }
  body.flush .row .pct { font-size: 32px; }
  body.flush footer {
    font-size: 28px;
    margin-top: 16px;
    padding-top: 16px;
    gap: 26px;
  }
  body.flush .split .sum { margin-left: 14px; padding-left: 14px; }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .live-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ff4d6d;
    box-shadow: 0 0 12px #ff4d6d;
    animation: pulse 1.6s ease-in-out infinite;
    flex: none;
  }
  .live-dot.off {
    background: #55505f;
    box-shadow: none;
    animation: none;
  }
  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.35;
    }
  }
  :root { --women: #ff6fb5; --men: #4da3ff; }

  /* Without this the colours are a guess. It is small on purpose -- the
     bars carry the meaning, this only names them. */
  .key {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: 16px;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #857f94;
  }
  .key i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }
  .key .kw { background: var(--women); box-shadow: 0 0 9px var(--women); }
  .key .km { background: var(--men); box-shadow: 0 0 9px var(--men); }
  .key span { margin-right: 10px; }

  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .total {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 9px;
  }
  .total b {
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
  }
  .total span {
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #857f94;
  }

  .row {
    display: grid;
    grid-template-columns: 168px 52px 1fr 66px;
    align-items: center;
    gap: 14px;
    padding: 7px 0;
  }
  .row .name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--c);
  }
  .row .n {
    font-size: 30px;
    font-weight: 700;
    text-align: right;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    display: flex;
  }
  /* One bar per bracket, split by who is in it: the whole fill still means
     what it always did (this bracket's share of every answer), and the
     colours say how that share divides. Rounding lives on the track rather
     than the segments so the two read as one continuous bar. */
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    transition: width 0.65s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .bar i.w { background: var(--women); box-shadow: 0 0 14px var(--women); }
  .bar i.m { background: var(--men);   box-shadow: 0 0 14px var(--men); }
  /* Answers with no gender recorded still have to occupy the bar, or the
     fill would silently understate the bracket it belongs to. */
  .bar i.o { background: #5d5670; }
  .bar i.m, .bar i.o { box-shadow: inset 1px 0 0 rgba(0, 0, 0, 0.45); }
  .row .pct {
    font-size: 19px;
    text-align: right;
    color: #9a94a8;
    font-variant-numeric: tabular-nums;
  }

  /* A bucket that just gained someone flares for a beat, so a viewer who
     glanced away still catches which way the last answer went. */
  .row.bump .n {
    animation: bump 0.7s ease;
  }
  @keyframes bump {
    0% {
      transform: scale(1);
      color: #fff;
    }
    30% {
      transform: scale(1.32);
      color: var(--c);
      text-shadow: 0 0 22px var(--c);
    }
    100% {
      transform: scale(1);
      color: #fff;
    }
  }

  footer {
    margin-top: 14px;
    padding-top: 13px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 17px;
    color: #857f94;
  }
  .split b {
    color: #e9e5f2;
    font-variant-numeric: tabular-nums;
  }
  .split .r {
    color: #7fe3a3;
  }
  .split .b {
    color: #ffb443;
  }
  .split .d {
    color: #ff4d6d;
  }
  /* The three brackets, then what they add up to. Reading "5-6-50" and
     working out 61 is exactly the arithmetic a viewer will not do, so the
     meter does it for them. Tinted to the same pink and blue as the bars,
     which also stops the line reading as one flat grey run of digits. */
  .split .sum {
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid rgba(255, 255, 255, 0.16);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .split .sum.w { color: var(--women); }
  .split .sum.m { color: var(--men); }
  .rarest {
    margin-left: auto;
    text-align: right;
  }
  .rarest b {
    color: #00ff6a;
    text-shadow: 0 0 14px rgba(0, 255, 106, 0.55);
  }

  body.vertical footer {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  body.vertical .rarest {
    margin-left: 0;
    text-align: left;
  }
  body.vertical .row {
    grid-template-columns: 150px 48px 1fr 60px;
  }
</style>

<div class="panel">
  <header>
    <span class="live-dot off" id="dot"></span>
    <span class="title" id="title">Delusion Meter</span>
    <span class="key"><i class="kw"></i><span>Girls</span><i class="km"></i><span>Guys</span></span>
    <span class="total"><b id="total" data-value="0">0</b><span>answered</span></span>
  </header>

  <div id="rows"></div>

  <footer>
    <div class="split">
      GIRLS <b><span class="r" id="wR">0</span>·<span class="b" id="wB">0</span>·<span class="d" id="wD">0</span></b><span class="sum w" id="wT">0</span>
      &nbsp;&nbsp; GUYS
      <b><span class="r" id="mR">0</span>·<span class="b" id="mB">0</span>·<span class="d" id="mD">0</span></b><span class="sum m" id="mT">0</span>
    </div>
    <div class="rarest">RAREST EVER <b id="rarest">—</b></div>
  </footer>
</div>

<script src="relay-client.js"></script>
<script src="common.js"></script>
<script>
  const P = params();
  if (P.get("o") === "v") document.body.classList.add("vertical");
  if (P.get("o") === "flush") document.body.classList.add("flush");
  if (P.get("title")) document.getElementById("title").textContent = P.get("title");

  const ORDER = ["realistic", "borderline", "delusional"];
  const rowsEl = document.getElementById("rows");

  rowsEl.innerHTML = ORDER.map(
    (k) => `
      <div class="row" id="row-${k}" style="--c:${BRACKETS[k].colour}">
        <span class="name">${BRACKETS[k].label}</span>
        <span class="n" id="n-${k}" data-value="0">0</span>
        <span class="bar"><i class="w" id="barw-${k}"></i><i class="m" id="barm-${k}"></i><i class="o" id="baro-${k}"></i></span>
        <span class="pct" id="p-${k}">0%</span>
      </div>`
  ).join("");

  let previous = { realistic: 0, borderline: 0, delusional: 0 };

  function paint(state) {
    const total = state.total || 0;
    countUp(document.getElementById("total"), total);

    ORDER.forEach((k) => {
      const n = state.brackets[k] || 0;
      const row = document.getElementById(`row-${k}`);
      countUp(document.getElementById(`n-${k}`), n);
      const share = total ? (n / total) * 100 : 0;
      // Segments are shares of the whole meter, not of the bracket, so the
      // three together still fill exactly as much of the track as the single
      // bar used to. Anything not attributed to a gender keeps its width in
      // the muted segment rather than shortening the bar.
      const wN = (state.byGender.woman || {})[k] || 0;
      const mN = (state.byGender.man || {})[k] || 0;
      const oN = Math.max(0, n - wN - mN);
      document.getElementById(`barw-${k}`).style.width = (total ? (wN / total) * 100 : 0) + "%";
      document.getElementById(`barm-${k}`).style.width = (total ? (mN / total) * 100 : 0) + "%";
      document.getElementById(`baro-${k}`).style.width = (total ? (oN / total) * 100 : 0) + "%";
      document.getElementById(`p-${k}`).textContent = Math.round(share) + "%";

      if (n > previous[k]) {
        row.classList.remove("bump");
        // Reading offsetWidth forces the class removal to take effect
        // before it's re-added, otherwise the animation never restarts.
        void row.offsetWidth;
        row.classList.add("bump");
      }
      previous[k] = n;
    });

    const w = state.byGender.woman || {};
    const m = state.byGender.man || {};
    document.getElementById("wR").textContent = w.realistic || 0;
    document.getElementById("wB").textContent = w.borderline || 0;
    document.getElementById("wD").textContent = w.delusional || 0;
    document.getElementById("mR").textContent = m.realistic || 0;
    document.getElementById("mB").textContent = m.borderline || 0;
    document.getElementById("mD").textContent = m.delusional || 0;
    const headcount = (g) => (g.realistic || 0) + (g.borderline || 0) + (g.delusional || 0);
    document.getElementById("wT").textContent = headcount(w);
    document.getElementById("mT").textContent = headcount(m);

    const rarest = state.rarest;
    document.getElementById("rarest").textContent = rarest
      ? `${rarest.pctText} · ${(TIERS[rarest.score] || {}).short || ""}`
      : "—";
  }

  // ?demo=1 fills the panel with plausible numbers so it can be sized and
  // positioned in OBS before a single guest has answered anything.
  if (P.get("demo") === "1") {
    document.getElementById("dot").classList.remove("off");
    paint({
      total: 27,
      brackets: { realistic: 8, borderline: 5, delusional: 14 },
      byGender: {
        woman: { realistic: 4, borderline: 3, delusional: 9 },
        man: { realistic: 4, borderline: 2, delusional: 5 },
      },
      rarest: { pctText: "0.004%", score: 5 },
    });
  } else {
    connectRelay({
      onState: paint,
      onStatus: (up) => document.getElementById("dot").classList.toggle("off", !up),
    });
  }
</script>
