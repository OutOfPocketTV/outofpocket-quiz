# Replies www.outofpocket.tv to "what app is this?" comments on YouTube:
# new questions straight away, and the backlog under old videos one reply
# per run. The bot itself, and how to connect it, is in comment-bot/.
#
# Runs on GitHub's machines, so it keeps working when the PC is off. Free:
# the repo is public, and public repos have unlimited Actions minutes.
#
# Until the three YOUTUBE_* secrets exist it logs "not connected yet" and
# exits cleanly, so merging this early never produces failure emails.
#
# To see it working without posting anything: Actions tab -> Comment reply
# bot -> Run workflow -> tick "dry run".

name: Comment reply bot

on:
  schedule:
    # Every 15 minutes, off the top of the hour when GitHub is busiest and
    # scheduled jobs start late. GitHub treats schedules as best-effort: the
    # first one took hours to be picked up after this file was added, and
    # re-saving the line is the usual nudge.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what it would reply to"
        type: boolean
        default: true
      lookback_hours:
        description: "How many hours back to look"
        default: "3"

# Never two runs at once: two overlapping runs could both see the same
# unanswered comment and both reply.
concurrency:
  group: comment-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: comment-bot

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The old-comments backfill remembers, between runs, which videos it has
      # scanned and which questions are still waiting. Each run restores the
      # newest copy and saves a new one (cache entries cannot be overwritten).
      # If the copy is ever lost the scan restarts; nothing gets answered
      # twice, because every thread is re-checked right before replying.
      - name: Restore backfill memory
        uses: actions/cache/restore@v4
        with:
          path: .bot-state
          key: comment-bot-state-${{ github.run_id }}
          restore-keys: comment-bot-state-

      - name: Reply to comments
        run: node comment-bot/run.js
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '3' }}
          BOT_STATE_FILE: .bot-state/backfill.json

      - name: Save backfill memory
        if: always() && hashFiles('.bot-state/backfill.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .bot-state
          key: comment-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
