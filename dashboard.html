<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Analytics — Out Of Pocket TV</title>
<style>
  :root {
    color-scheme: dark;

    /* --- Site design tokens (mirrored from style.css) --- */
    --bg: #060606;
    --card-top: #1d1d1d;
    --card-bottom: #121212;
    --accent: #ffffff;
    --on-accent: #0a0a0a;
    --text: #f3f3f3;
    --text-dim: #969696;
    --track: #2c2c2c;
    --border: rgba(255, 255, 255, 0.08);

    /* --- Chart roles ---
       Series hues derive from the site's ambient purple glow. Validated with
       the data-viz palette checker against the card surface (#1d1d1d):
       categorical pair passes CVD ΔE 17.3 / normal ΔE 24.6, both >= 3:1
       contrast; the funnel ramp passes ordinal monotonicity, adjacent ΔL,
       single-hue spread, and 3.71:1 at the step nearest the surface. */
    --series-1: #9085e9;   /* sessions -- brand violet */
    --series-2: #199e70;   /* users -- aqua */
    --grid: rgba(255, 255, 255, 0.07);
    --axis: rgba(255, 255, 255, 0.14);
    --muted-ink: #898781;

    /* Ordinal ramp: funnel stages, brightest (widest) -> dimmest (narrowest) */
    --stage-1: #d5d0f7;
    --stage-2: #bcb4f2;
    --stage-3: #a49aed;
    --stage-4: #8b7fe6;
    --stage-5: #7166db;

    /* Status -- reserved for deltas only, always paired with an arrow glyph */
    --good: #0ca30c;
    --bad: #d03b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* --- Ambient background, matching the main site --- */
  .ambient-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #050505;
  }
  .ambient-top-glow {
    position: absolute;
    top: -25%;
    left: 50%;
    transform: translateX(-50%);
    width: 160%;
    height: 55%;
    background: radial-gradient(ellipse at center, rgba(101, 78, 179, 0.28) 0%, rgba(60, 50, 110, 0.10) 45%, transparent 75%);
  }
  .ambient-horizon {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 40%;
    background: linear-gradient(180deg, transparent 0%, rgba(20, 16, 40, 0.5) 100%);
  }

  .page { position: relative; z-index: 1; }

  /* --- Brand header --- */
  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 16px 0;
  }
  .brand-logo { width: 34px; height: 34px; flex-shrink: 0; }
  .brand-name {
    font-family: "Arial Black", "Franklin Gothic Bold", Impact, sans-serif;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-size: 1.05rem;
    line-height: 1;
    white-space: nowrap;
    background: linear-gradient(180deg, #ffffff 0%, #b7b7b7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 20px 80px; }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 22px;
  }
  .page-head h1 { font-size: 1.55rem; font-weight: 400; margin: 0 0 4px; }
  .page-head .sub { color: var(--text-dim); font-size: 0.9rem; margin: 0; }

  /* --- Filter row: one row, above everything it scopes --- */
  .range { display: flex; gap: 8px; }
  .range button {
    background: linear-gradient(160deg, #232323 0%, #101010 100%);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  .range button:hover { color: var(--text); transform: translateY(-1px); }
  .range button[aria-pressed="true"] {
    background: linear-gradient(180deg, #ffffff 0%, #d9d9d9 100%);
    color: var(--on-accent);
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(255, 255, 255, 0.14);
  }
  button:focus-visible, summary:focus-visible, .chart-host:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* --- Cards --- */
  .card {
    background: linear-gradient(160deg, var(--card-top) 0%, var(--card-bottom) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  section { margin-bottom: 18px; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  .card-note { color: var(--text-dim); font-size: 0.8rem; margin: 3px 0 0; }
  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
  }

  /* --- KPI row --- */
  .kpis { display: grid; grid-template-columns: 1.55fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi-hero { grid-column: 1 / -1; } }
  @media (max-width: 460px) { .kpis { grid-template-columns: 1fr; } }

  .kpi .label {
    color: var(--text-dim);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  /* Proportional figures on standalone values -- tabular-nums is reserved
     for columns that align vertically (tables, axis ticks). */
  .kpi .value { font-size: 1.7rem; font-weight: 600; margin-top: 8px; line-height: 1.1; }
  .kpi-hero .value { font-size: 3rem; font-weight: 600; letter-spacing: -0.5px; }
  .kpi-hero { display: flex; flex-direction: column; }
  .spark { margin-top: auto; padding-top: 14px; }
  .spark svg { display: block; width: 100%; height: 40px; overflow: visible; }

  .delta { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; margin-top: 9px; }
  .delta .arrow { font-size: 0.9em; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .delta.flat { color: var(--text-dim); }
  .delta .vs { color: var(--text-dim); }

  /* --- Legend --- */
  .legend { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .legend .item { display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--text-dim); }
  .legend .key { width: 16px; height: 3px; border-radius: 2px; flex-shrink: 0; }

  /* --- Chart host --- */
  .chart-host { position: relative; width: 100%; }
  .chart-host svg { display: block; width: 100%; }
  .chart-host text { fill: var(--muted-ink); font-size: 11px; font-variant-numeric: tabular-nums; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(10, 10, 10, 0.94);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.78rem;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 3;
  }
  .tooltip.on { opacity: 1; }
  .tooltip .tt-date { color: var(--text-dim); margin-bottom: 5px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 7px; }
  .tooltip .tt-row + .tt-row { margin-top: 3px; }
  .tooltip .tt-key { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .tooltip .tt-val { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }

  /* --- Funnel --- */
  .funnel-row + .funnel-row { margin-top: 16px; }
  .funnel-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
  .funnel-name { font-size: 0.87rem; }
  .funnel-val { font-size: 0.87rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* 20px bar (spec caps at 24px); the row gap is the surface separation. */
  .funnel-track { height: 20px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .funnel-fill {
    height: 100%;
    /* Square at the baseline, 4px rounded at the data end. */
    border-radius: 0 4px 4px 0;
    transition: width 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @media (prefers-reduced-motion: reduce) { .funnel-fill { transition: none; } }
  .funnel-pct { font-size: 0.76rem; color: var(--text-dim); margin-top: 6px; }

  /* --- Money --- */
  .money-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; margin-bottom: 4px; }
  .money-item .label { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; }
  .money-item .amount { font-size: 1.5rem; font-weight: 600; margin-top: 7px; }
  .money-item .hint { color: var(--text-dim); font-size: 0.74rem; margin-top: 5px; line-height: 1.45; }
  .payouts { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
  .payouts h3 { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; font-weight: 500; }
  .payout-row { display: flex; align-items: baseline; gap: 10px; font-size: 0.83rem; flex-wrap: wrap; }
  .payout-row + .payout-row { margin-top: 8px; }
  .payout-row .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
  .payout-row .meta { color: var(--text-dim); }
  .pill {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .pill.paid { color: var(--good); border-color: rgba(12, 163, 12, 0.35); }
  .pill.failed { color: var(--bad); border-color: rgba(208, 59, 59, 0.35); }
  .notice {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
    font-size: 0.79rem; color: var(--text-dim); line-height: 1.55;
  }
  .notice a { color: var(--text); }
  .notice strong { color: var(--text); font-weight: 600; }

  /* --- Countries --- */
  .geo-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 14px; align-items: center; }
  .geo-row + .geo-row { margin-top: 11px; }
  .geo-name { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* display:block -- these are spans, and inline boxes ignore width/height. */
  .geo-track { display: block; height: 12px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .geo-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--series-1); }
  .geo-val { font-size: 0.85rem; font-variant-numeric: tabular-nums; color: var(--text-dim); min-width: 52px; text-align: right; }

  /* --- Table twins --- */
  details.tbl { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
  details.tbl summary {
    cursor: pointer; font-size: 0.78rem; color: var(--text-dim);
    list-style: none; display: inline-flex; align-items: center; gap: 6px;
  }
  details.tbl summary::-webkit-details-marker { display: none; }
  details.tbl summary::before { content: "▸"; font-size: 0.7em; transition: transform 0.15s ease; }
  details.tbl[open] summary::before { transform: rotate(90deg); }
  details.tbl summary:hover { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* --- Password gate --- */
  #gate { max-width: 360px; margin: 90px auto; padding: 0 20px; text-align: center; }
  #gate h1 { font-size: 1.3rem; font-weight: 400; margin: 0 0 6px; }
  #gate p { color: var(--text-dim); font-size: 0.88rem; margin: 0 0 20px; }
  #gate input {
    width: 100%; padding: 13px 15px;
    background: #0f0f0f; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 0.95rem; font-family: inherit;
  }
  #gate input:focus { outline: none; border-color: rgba(255, 255, 255, 0.3); }
  #gate button {
    width: 100%; margin-top: 10px; padding: 13px;
    background: linear-gradient(160deg, #232323 0%, #101010 100%);
    border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; font-size: 0.95rem; font-weight: 700; font-family: inherit;
    letter-spacing: 0.3px; cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  #gate button:hover {
    background: linear-gradient(180deg, #ffffff 0%, #d9d9d9 100%);
    color: var(--on-accent);
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
    transform: translateY(-1px);
  }
  #gate .err { color: #ff9a9a; font-size: 0.82rem; margin-top: 12px; min-height: 18px; }

  .state-msg { color: var(--text-dim); padding: 44px 20px; text-align: center; line-height: 1.65; font-size: 0.9rem; }
  .empty { color: var(--text-dim); font-size: 0.85rem; padding: 10px 0; }

  /* Refetch: hold the previous render at reduced opacity, no layout jump. */
  #content { transition: opacity 0.18s ease; }
  #content.busy { opacity: 0.45; }

  /* Scroll-reveal, matching the site's card entrance. */
  body.reveal-ready .reveal:not(.in-view) { opacity: 0; transform: translateY(16px); }
  body.reveal-ready .reveal.in-view {
    opacity: 1; transform: translateY(0);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    body.reveal-ready .reveal:not(.in-view) { opacity: 1; transform: none; }
    body.reveal-ready .reveal.in-view { transition: none; }
  }
</style>
</head>
<body>

<div class="ambient-bg" aria-hidden="true">
  <div class="ambient-top-glow"></div>
  <div class="ambient-horizon"></div>
</div>

<div class="page">

  <div id="gate">
    <div class="brand-bar" style="padding-bottom:26px;">
      <img class="brand-logo" src="logo-mark.png" alt="" />
      <span class="brand-name">OUT OF POCKET TV</span>
    </div>
    <h1>Analytics</h1>
    <p>Enter the dashboard password to continue.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" />
    <button id="pw-submit" type="button">Unlock</button>
    <div class="err" id="pw-err" role="alert"></div>
  </div>

  <div id="app" hidden>
    <div class="brand-bar">
      <img class="brand-logo" src="logo-mark.png" alt="" />
      <span class="brand-name">OUT OF POCKET TV</span>
    </div>

    <div class="wrap">
      <div class="page-head">
        <div>
          <h1>Analytics</h1>
          <p class="sub">outofpocket.tv — traffic and conversion funnel</p>
        </div>
        <div class="range" role="group" aria-label="Date range">
          <button type="button" data-days="7" aria-pressed="false">7 days</button>
          <button type="button" data-days="30" aria-pressed="true">30 days</button>
          <button type="button" data-days="90" aria-pressed="false">90 days</button>
        </div>
      </div>

      <div id="content">
        <div class="state-msg">Loading…</div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  // localStorage (not sessionStorage) so the password survives closing
  // the tab/browser -- a deliberate convenience-over-caution tradeoff
  // for this single-user dashboard on the owner's own machine.
  var STORAGE_KEY = "oop_dashboard_pw";

  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var pwInput = document.getElementById("pw");
  var pwErr = document.getElementById("pw-err");
  var content = document.getElementById("content");
  var rangeBtns = Array.prototype.slice.call(document.querySelectorAll(".range button"));

  var currentDays = 30;
  var lastData = null;

  var SERIES = {
    sessions: { label: "Sessions", color: "var(--series-1)" },
    users: { label: "Users", color: "var(--series-2)" }
  };
  var STAGE_COLORS = ["var(--stage-1)", "var(--stage-2)", "var(--stage-3)", "var(--stage-4)", "var(--stage-5)"];

  // ── formatting ──────────────────────────────────────────────────────────
  function fmt(n) { return Number(n || 0).toLocaleString(); }
  function compact(n) {
    n = Number(n || 0);
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return n.toLocaleString();
  }
  function pct(part, whole, dp) {
    if (!whole) return "0%";
    return ((part / whole) * 100).toFixed(dp === undefined ? 1 : dp) + "%";
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function parseDate(yyyymmdd) {
    var m = /^(\d{4})(\d{2})(\d{2})$/.exec(yyyymmdd);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function shortDate(yyyymmdd) {
    var d = parseDate(yyyymmdd);
    if (!d) return yyyymmdd;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function longDate(yyyymmdd) {
    var d = parseDate(yyyymmdd);
    if (!d) return yyyymmdd;
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function niceMax(v) {
    if (!(v > 0)) return 10;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / mag;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  // Delta vs the equal-length preceding window. Arrow glyph + "vs previous"
  // label always accompany the color, so direction never rides on hue alone.
  function deltaHtml(curr, prev, days) {
    var cls, arrow, txt;
    if (!prev) {
      if (!curr) return "";
      cls = "flat"; arrow = "→"; txt = "no prior data";
      return '<div class="delta ' + cls + '"><span class="arrow" aria-hidden="true">' + arrow +
        '</span><span>' + txt + '</span></div>';
    }
    var change = ((curr - prev) / prev) * 100;
    var rounded = Math.abs(change) < 0.05 ? 0 : change;
    cls = rounded > 0 ? "up" : rounded < 0 ? "down" : "flat";
    arrow = rounded > 0 ? "↑" : rounded < 0 ? "↓" : "→";
    txt = (rounded > 0 ? "+" : "") + rounded.toFixed(1) + "%";
    return '<div class="delta ' + cls + '"><span class="arrow" aria-hidden="true">' + arrow +
      '</span><span>' + txt + '</span><span class="vs">vs prev ' + days + 'd</span></div>';
  }

  // ── auth ────────────────────────────────────────────────────────────────
  function request(password, days) {
    return fetch("/api/analytics-dashboard?days=" + days, {
      headers: { Authorization: "Bearer " + password }
    }).then(function (res) {
      if (res.status === 401) throw { kind: "auth" };
      return res.json().then(function (body) {
        if (!res.ok) throw { kind: "data", body: body };
        return body;
      });
    });
  }

  function tryPassword(password, remember) {
    pwErr.textContent = "";
    if (lastData) content.classList.add("busy");
    return request(password, currentDays)
      .then(function (data) {
        if (remember) localStorage.setItem(STORAGE_KEY, password);
        gate.hidden = true;
        app.hidden = false;
        lastData = data;
        content.classList.remove("busy");
        render(data);
      })
      .catch(function (err) {
        content.classList.remove("busy");
        if (err && err.kind === "auth") {
          localStorage.removeItem(STORAGE_KEY);
          gate.hidden = false;
          app.hidden = true;
          pwErr.textContent = "Wrong password.";
        } else {
          gate.hidden = true;
          app.hidden = false;
          renderError(err && err.body);
        }
      });
  }

  document.getElementById("pw-submit").addEventListener("click", function () {
    tryPassword(pwInput.value, true);
  });
  pwInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryPassword(pwInput.value, true);
  });

  rangeBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      rangeBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      currentDays = Number(btn.dataset.days);
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) tryPassword(saved, false);
    });
  });

  function renderError(body) {
    var reason = body && body.error;
    content.innerHTML = reason === "not_configured"
      ? '<div class="card state-msg">Analytics isn’t wired up yet.<br>Set <code>GOOGLE_ANALYTICS_PROPERTY_ID</code>, <code>GOOGLE_ANALYTICS_CLIENT_EMAIL</code>, <code>GOOGLE_ANALYTICS_PRIVATE_KEY</code> and <code>DASHBOARD_PASSWORD</code> in your Vercel project’s environment variables, then redeploy.</div>'
      : '<div class="card state-msg">Couldn’t load analytics data.<br>Check the Vercel function logs for details.</div>';
  }

  // ── sparkline (hero tile) ───────────────────────────────────────────────
  function sparkline(series) {
    if (series.length < 2) return "";
    var pts = series.map(function (d) { return d.sessions; });
    var max = Math.max.apply(null, pts) || 1;
    var W = 100, H = 40;
    var stepX = W / (pts.length - 1);
    var coords = pts.map(function (v, i) {
      return [i * stepX, H - (v / max) * (H - 4) - 2];
    });
    var line = coords.map(function (c) { return c[0].toFixed(2) + "," + c[1].toFixed(2); }).join(" ");
    var area = line + " " + W + "," + H + " 0," + H;
    var last = coords[coords.length - 1];
    return '<div class="spark" aria-hidden="true"><svg viewBox="0 0 ' + W + " " + H +
      '" preserveAspectRatio="none" focusable="false">' +
      '<polygon points="' + area + '" fill="var(--series-1)" opacity="0.10"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--series-1)" stroke-width="1.5" ' +
      'stroke-linejoin="round" stroke-linecap="round" opacity="0.55" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="2.5" fill="var(--series-1)" ' +
      'vector-effect="non-scaling-stroke"/></svg></div>';
  }

  // ── trend chart ─────────────────────────────────────────────────────────
  // Rendered at true pixel size (not a scaled viewBox) so 2px strokes and
  // 11px labels stay exactly that at any container width.
  function drawTrend() {
    var host = document.getElementById("trend-host");
    if (!host || !lastData) return;
    var series = lastData.series || [];
    var tip = document.getElementById("trend-tip");

    var W = Math.max(host.clientWidth || 0, 280);
    var H = 268;
    // Bottom band reserves the x-axis labels; the right band reserves room for
    // the endpoint value so the label sits beside the dot, never over the line.
    var P = { l: 48, r: 58, t: 12, b: 34 };
    var iw = W - P.l - P.r, ih = H - P.t - P.b;

    if (!series.length) {
      host.innerHTML = '<div class="empty">No sessions recorded in this range yet.</div>';
      return;
    }

    var peak = Math.max(1, Math.max.apply(null, series.map(function (d) {
      return Math.max(d.sessions, d.users);
    })));
    var yMax = niceMax(peak);
    var n = series.length;
    var stepX = n > 1 ? iw / (n - 1) : 0;
    var X = function (i) { return P.l + i * stepX; };
    var Y = function (v) { return P.t + ih - (v / yMax) * ih; };

    var svg = [];
    svg.push('<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Sessions and users per day">');

    // Gridlines + y ticks: hairline, solid, recessive; clean round values.
    [0, 0.5, 1].forEach(function (f) {
      var v = yMax * f, y = Y(v);
      svg.push('<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y +
        '" stroke="' + (f === 0 ? "var(--axis)" : "var(--grid)") + '" stroke-width="1"/>');
      svg.push('<text x="' + (P.l - 10) + '" y="' + (y + 4) + '" text-anchor="end">' + fmt(Math.round(v)) + "</text>");
    });

    // x labels, thinned so they never collide
    var everyX = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 78))));
    series.forEach(function (d, i) {
      if (i % everyX !== 0 && i !== n - 1) return;
      if (i !== n - 1 && (n - 1 - i) < everyX * 0.6) return;  // avoid crowding the last label
      svg.push('<text x="' + X(i) + '" y="' + (H - 12) + '" text-anchor="middle">' + esc(shortDate(d.date)) + "</text>");
    });

    // Area wash for the primary series only -- two overlapping fills muddy.
    var sessPts = series.map(function (d, i) { return X(i) + "," + Y(d.sessions); }).join(" ");
    var userPts = series.map(function (d, i) { return X(i) + "," + Y(d.users); }).join(" ");
    svg.push('<polygon points="' + sessPts + " " + X(n - 1) + "," + Y(0) + " " + X(0) + "," + Y(0) +
      '" fill="var(--series-1)" opacity="0.10"/>');
    svg.push('<polyline points="' + userPts + '" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    svg.push('<polyline points="' + sessPts + '" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');

    // Crosshair + hover markers (hidden until pointer/keyboard activity)
    svg.push('<g id="trend-cursor" style="opacity:0">');
    svg.push('<line id="tc-line" y1="' + P.t + '" y2="' + (P.t + ih) + '" stroke="var(--axis)" stroke-width="1"/>');
    // 8px markers (r=4) with a 2px surface ring so they stay legible on the line
    svg.push('<circle id="tc-u" r="4" fill="var(--series-2)" stroke="var(--card-bottom)" stroke-width="2"/>');
    svg.push('<circle id="tc-s" r="4" fill="var(--series-1)" stroke="var(--card-bottom)" stroke-width="2"/>');
    svg.push("</g>");

    // Selective direct label: the sessions endpoint only, and only when it
    // clears the users endpoint -- collapsed labels read as noise.
    var lastI = n - 1;
    var ySess = Y(series[lastI].sessions), yUser = Y(series[lastI].users);
    // Inline style (not a fill attribute) so it beats the muted axis-text rule.
    if (Math.abs(ySess - yUser) > 14 && stepX > 0) {
      svg.push('<text x="' + (X(lastI) + 10) + '" y="' + (ySess + 4) +
        '" text-anchor="start" font-weight="600" style="fill:var(--text)">' +
        fmt(series[lastI].sessions) + "</text>");
    }
    svg.push('<circle cx="' + X(lastI) + '" cy="' + yUser + '" r="4" fill="var(--series-2)" stroke="var(--card-bottom)" stroke-width="2"/>');
    svg.push('<circle cx="' + X(lastI) + '" cy="' + ySess + '" r="4" fill="var(--series-1)" stroke="var(--card-bottom)" stroke-width="2"/>');

    svg.push('<rect id="trend-hit" x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + ih + '" fill="transparent"/>');
    svg.push("</svg>");
    host.innerHTML = svg.join("");

    // ── hover / keyboard cursor ──
    var cursor = host.querySelector("#trend-cursor");
    var cLine = host.querySelector("#tc-line");
    var cS = host.querySelector("#tc-s");
    var cU = host.querySelector("#tc-u");
    var active = -1;

    function showAt(i) {
      if (i < 0 || i >= n) return;
      active = i;
      var d = series[i], x = X(i);
      cLine.setAttribute("x1", x); cLine.setAttribute("x2", x);
      cS.setAttribute("cx", x); cS.setAttribute("cy", Y(d.sessions));
      cU.setAttribute("cx", x); cU.setAttribute("cy", Y(d.users));
      cursor.style.opacity = "1";

      tip.innerHTML =
        '<div class="tt-date">' + esc(longDate(d.date)) + "</div>" +
        '<div class="tt-row"><span class="tt-key" style="background:var(--series-1)"></span>Sessions<span class="tt-val">' + fmt(d.sessions) + "</span></div>" +
        '<div class="tt-row"><span class="tt-key" style="background:var(--series-2)"></span>Users<span class="tt-val">' + fmt(d.users) + "</span></div>";
      tip.classList.add("on");
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var left = Math.min(Math.max(x - tw / 2, 4), W - tw - 4);
      tip.style.left = left + "px";
      tip.style.top = Math.max(Y(Math.max(d.sessions, d.users)) - th - 14, 4) + "px";
      host.setAttribute("aria-label",
        longDate(d.date) + ": " + d.sessions + " sessions, " + d.users + " users");
    }
    function hide() {
      active = -1;
      cursor.style.opacity = "0";
      tip.classList.remove("on");
    }
    function indexFromX(clientX) {
      var r = host.getBoundingClientRect();
      var rel = clientX - r.left - P.l;
      if (stepX <= 0) return 0;
      return Math.max(0, Math.min(n - 1, Math.round(rel / stepX)));
    }

    host.onpointermove = function (e) { showAt(indexFromX(e.clientX)); };
    host.onpointerleave = hide;
    host.onkeydown = function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        var next = active < 0 ? n - 1 : active + (e.key === "ArrowRight" ? 1 : -1);
        showAt(Math.max(0, Math.min(n - 1, next)));
      } else if (e.key === "Escape") { hide(); }
    };
    host.onblur = hide;
  }

  // ── funnel ──────────────────────────────────────────────────────────────
  // Every stage counts distinct people, so the top of the funnel is users --
  // not sessions -- and no stage can exceed 100%.
  function funnelStages(d) {
    return [
      { label: "Visited the site", value: d.totals.users, prev: d.prevTotals ? d.prevTotals.users : 0 },
      { label: "Clicked “Find Out”", value: d.funnel.find_out_click, prev: d.prevFunnel ? d.prevFunnel.find_out_click : 0 },
      { label: "Saw the paywall", value: d.funnel.paywall_view, prev: d.prevFunnel ? d.prevFunnel.paywall_view : 0 },
      { label: "Began checkout", value: d.funnel.begin_checkout, prev: d.prevFunnel ? d.prevFunnel.begin_checkout : 0 },
      { label: "Purchased", value: d.funnel.purchase, prev: d.prevFunnel ? d.prevFunnel.purchase : 0 }
    ];
  }

  function funnelHtml(stages) {
    var top = stages[0].value || 1;
    var rows = stages.map(function (s, i) {
      var w = Math.max((s.value / top) * 100, s.value > 0 ? 0.8 : 0);
      var ofPrev = i > 0 ? pct(s.value, stages[i - 1].value) + " of previous step" : "entry point";
      var title = s.label + ": " + fmt(s.value) + " · " + pct(s.value, top) + " of visitors";
      return '<div class="funnel-row" title="' + esc(title) + '">' +
        '<div class="funnel-top"><span class="funnel-name">' + esc(s.label) + "</span>" +
        '<span class="funnel-val">' + fmt(s.value) + "</span></div>" +
        '<div class="funnel-track"><div class="funnel-fill" style="width:' + w.toFixed(2) +
        "%;background:" + STAGE_COLORS[i] + '"></div></div>' +
        '<div class="funnel-pct">' + pct(s.value, top) + " of all visitors · " + ofPrev + "</div></div>";
    }).join("");

    var tbl = "<table><thead><tr><th>Stage</th><th class=\"num\">People</th><th class=\"num\">Of visitors</th><th class=\"num\">Of previous</th></tr></thead><tbody>" +
      stages.map(function (s, i) {
        return "<tr><td>" + esc(s.label) + '</td><td class="num">' + fmt(s.value) +
          '</td><td class="num">' + pct(s.value, top) +
          '</td><td class="num">' + (i > 0 ? pct(s.value, stages[i - 1].value) : "—") + "</td></tr>";
      }).join("") + "</tbody></table>";

    return rows + '<details class="tbl"><summary>Table view</summary>' + tbl + "</details>";
  }

  // ── money (Stripe, read-only) ───────────────────────────────────────────
  function money(minorUnits, currency) {
    var v = Number(minorUnits || 0) / 100;
    try {
      return v.toLocaleString(undefined, {
        style: "currency", currency: (currency || "usd").toUpperCase(),
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });
    } catch (e) {
      return (currency || "").toUpperCase() + " " + v.toFixed(2);
    }
  }
  function payoutDate(unixSec) {
    if (!unixSec) return "";
    return new Date(unixSec * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function moneyHtml(s, days, gaPurchases) {
    if (!s || s.configured === false) {
      return '<div class="empty">Stripe isn’t configured on this deployment, so revenue can’t be shown.' +
        (s && s.error ? " (The Stripe lookup failed — check the Vercel function logs.)" : "") + "</div>";
    }

    var grid =
      '<div class="money-grid">' +
        '<div class="money-item"><div class="label">Earned, last ' + days + ' days</div>' +
          '<div class="amount">' + money(s.gross, s.currency) + "</div>" +
          '<div class="hint">' + fmt(s.orders) + (s.orders === 1 ? " paid order" : " paid orders") +
          (s.truncated ? " (first 100 shown)" : "") + "</div></div>" +
        '<div class="money-item"><div class="label">Available in Stripe</div>' +
          '<div class="amount">' + money(s.available, s.currency) + "</div>" +
          '<div class="hint">Ready to be paid out to your bank.</div></div>' +
        '<div class="money-item"><div class="label">Pending in Stripe</div>' +
          '<div class="amount">' + money(s.pending, s.currency) + "</div>" +
          '<div class="hint">Still clearing — usually becomes available within a few days.</div></div>' +
      "</div>";

    var payouts;
    if (s.payouts && s.payouts.length) {
      payouts = '<div class="payouts"><h3>Recent payouts to your bank</h3>' +
        s.payouts.map(function (p) {
          var cls = p.status === "paid" ? "paid" : (p.status === "failed" || p.status === "canceled") ? "failed" : "";
          return '<div class="payout-row"><span class="amt">' + money(p.amount, p.currency) + "</span>" +
            '<span class="pill ' + cls + '">' + esc(p.status) + "</span>" +
            '<span class="meta">' + esc(payoutDate(p.arrival)) +
            (p.bank ? " → " + esc(p.bank) : "") + "</span></div>";
        }).join("") + "</div>";
    } else {
      payouts = '<div class="payouts"><h3>Recent payouts to your bank</h3>' +
        '<div class="empty">No payouts yet. If money is sitting in “Available” above, it usually means no bank account is connected to your Stripe account yet.</div></div>';
    }

    // Ground truth vs. the GA4 purchase event -- if Stripe recorded sales that
    // GA4 missed, the tracking is broken rather than the sales being absent.
    var mismatch = "";
    if (s.orders > 0 && !gaPurchases) {
      mismatch = '<div class="notice"><strong>Worth checking:</strong> Stripe recorded ' + fmt(s.orders) +
        ' paid order' + (s.orders === 1 ? "" : "s") + ' in this period but Google Analytics logged no <code>purchase</code> event. ' +
        'The sales are real — it’s the analytics tracking that’s missing them.</div>';
    }

    var note = '<div class="notice">Stripe holds your money and pays it out to your bank automatically on a schedule — ' +
      'there’s nothing to withdraw by hand. To connect or change the bank account, or to see full invoices, use ' +
      '<a href="https://dashboard.stripe.com/balance" target="_blank" rel="noopener noreferrer">your Stripe dashboard</a>, ' +
      'which is protected by its own login.</div>';

    return grid + payouts + mismatch + note;
  }

  // ── countries ───────────────────────────────────────────────────────────
  function countriesHtml(countries) {
    if (!countries.length) return '<div class="empty">No country data in this range yet.</div>';
    var top = countries[0].sessions || 1;
    // Nominal categories -> one series colour for every bar (never a value ramp).
    return countries.map(function (c) {
      return '<div class="geo-row" title="' + esc(c.country + ": " + fmt(c.sessions) + " sessions") + '">' +
        '<span class="geo-name">' + esc(c.country) + "</span>" +
        '<span class="geo-track"><span class="geo-fill" style="width:' +
        Math.max((c.sessions / top) * 100, 1).toFixed(2) + '%"></span></span>' +
        '<span class="geo-val">' + fmt(c.sessions) + "</span></div>";
    }).join("");
  }

  // ── render ──────────────────────────────────────────────────────────────
  function render(d) {
    var days = d.days;
    var stages = funnelStages(d);
    // Transactions, not distinct buyers -- falls back to the user count if an
    // older API response has no funnelEvents.
    var purchases = d.funnelEvents ? d.funnelEvents.purchase : d.funnel.purchase;
    var prevPurchases = d.prevFunnelEvents ? d.prevFunnelEvents.purchase
      : (d.prevFunnel ? d.prevFunnel.purchase : 0);
    var conv = d.totals.users ? (d.funnel.purchase / d.totals.users) * 100 : 0;
    var prevConv = d.prevTotals && d.prevTotals.users && d.prevFunnel
      ? (d.prevFunnel.purchase / d.prevTotals.users) * 100 : 0;

    var kpis =
      '<div class="kpis">' +
        '<div class="card kpi kpi-hero reveal">' +
          '<div class="label">Sessions</div>' +
          '<div class="value">' + compact(d.totals.sessions) + "</div>" +
          deltaHtml(d.totals.sessions, d.prevTotals && d.prevTotals.sessions, days) +
          sparkline(d.series || []) +
        "</div>" +
        '<div class="card kpi reveal"><div class="label">Users</div><div class="value">' +
          compact(d.totals.users) + "</div>" +
          deltaHtml(d.totals.users, d.prevTotals && d.prevTotals.users, days) + "</div>" +
        '<div class="card kpi reveal"><div class="label">Purchases</div><div class="value">' +
          fmt(purchases) + "</div>" +
          deltaHtml(purchases, prevPurchases, days) + "</div>" +
        '<div class="card kpi reveal"><div class="label">Visitor → purchase</div><div class="value">' +
          conv.toFixed(2) + "%</div>" +
          deltaHtml(conv, prevConv, days) + "</div>" +
      "</div>";

    var trendTable = "<table><thead><tr><th>Date</th><th class=\"num\">Sessions</th><th class=\"num\">Users</th></tr></thead><tbody>" +
      (d.series || []).map(function (r) {
        return "<tr><td>" + esc(longDate(r.date)) + '</td><td class="num">' + fmt(r.sessions) +
          '</td><td class="num">' + fmt(r.users) + "</td></tr>";
      }).join("") + "</tbody></table>";

    var trend =
      '<section class="card reveal">' +
        '<div class="card-head">' +
          '<div><h2 class="card-title">Traffic over time</h2>' +
          '<p class="card-note">Daily sessions and users, last ' + days + " days</p></div>" +
          '<div class="legend">' +
            '<span class="item"><span class="key" style="background:var(--series-1)"></span>Sessions</span>' +
            '<span class="item"><span class="key" style="background:var(--series-2)"></span>Users</span>' +
          "</div>" +
        "</div>" +
        '<div class="chart-host" id="trend-host" tabindex="0" role="img" aria-label="Sessions and users per day. Use arrow keys to step through days.">' +
        "</div><div class=\"tooltip\" id=\"trend-tip\" role=\"status\"></div>" +
        '<details class="tbl"><summary>Table view</summary>' + trendTable + "</details>" +
      "</section>";

    var funnel =
      '<section class="card reveal">' +
        '<div class="card-head"><div><h2 class="card-title">Conversion funnel</h2>' +
        '<p class="card-note">Distinct people reaching each step, last ' + days + " days</p></div></div>" +
        funnelHtml(stages) +
      "</section>";

    var geoTable = "<table><thead><tr><th>Country</th><th class=\"num\">Sessions</th><th class=\"num\">Share</th></tr></thead><tbody>" +
      (d.countries || []).map(function (c) {
        return "<tr><td>" + esc(c.country) + '</td><td class="num">' + fmt(c.sessions) +
          '</td><td class="num">' + pct(c.sessions, d.totals.sessions) + "</td></tr>";
      }).join("") + "</tbody></table>";

    var moneyCard =
      '<section class="card reveal">' +
        '<div class="card-head"><div><h2 class="card-title">Revenue &amp; payouts</h2>' +
        '<p class="card-note">Live from Stripe — read-only, last ' + days + " days</p></div></div>" +
        moneyHtml(d.stripe, days, purchases) +
      "</section>";

    var geo =
      '<section class="card reveal">' +
        '<div class="card-head"><div><h2 class="card-title">Top countries</h2>' +
        '<p class="card-note">Sessions by country, last ' + days + " days</p></div></div>" +
        countriesHtml(d.countries || []) +
        '<details class="tbl"><summary>Table view</summary>' + geoTable + "</details>" +
      "</section>";

    content.innerHTML = kpis + trend + funnel + moneyCard + geo;

    // The chart host needs layout before it can be measured.
    requestAnimationFrame(drawTrend);
    revealCards();
  }

  // Re-render the chart at the new pixel width (debounced).
  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawTrend, 150);
  });

  function revealCards() {
    var els = Array.prototype.slice.call(content.querySelectorAll(".reveal"));
    if (!("IntersectionObserver" in window)) {
      els.forEach(function (el) { el.classList.add("in-view"); });
      return;
    }
    document.body.classList.add("reveal-ready");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in-view"); io.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    els.forEach(function (el) { io.observe(el); });
  }

  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) tryPassword(saved, false);
})();
</script>

</body>
</html>
